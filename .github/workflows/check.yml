name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: test
        # no install step: the worker has no dependencies and the suite runs
        # on node's own test runner. The task lives in mise.toml so a
        # workstation and a runner run the same thing on the same node.
        run: mise run test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: ruff
        # ruff's version is pinned in mise.toml rather than resolved fresh
        # on every run: a new release finding a new class of problem should
        # be a commit, not a build that fails without one.
        run: mise run lint

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --severity=error \
            .github/scripts/*.sh \
            packages/manjaro-sway-settings/payload/usr/bin/* \
            packages/manjaro-sway-settings/payload/usr/local/bin/* \
            packages/manjaro-sway-settings/payload/usr/share/sway/scripts/*.sh

  iso-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: every package the profile lists resolves
        # the same check build-iso runs, here so a pull request that adds an
        # unresolvable name fails in seconds rather than an hour into a build
        run: mise run check-iso-packages

  packages:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: every PKGBUILD parses and its checksums match its sources
        # a stale sha256sum fails the build twenty minutes in; catch it here
        run: |
          # git: several PKGBUILDs take git+ sources, which makepkg
          # refuses to even look at without it
          pacman -Sy --noconfirm --needed pacman-contrib git >/dev/null
          useradd -m builder
          chown -R builder:builder .
          fail=0
          for pkgbuild in packages/*/PKGBUILD; do
            dir=$(dirname "$pkgbuild")
            if ! sudo -u builder bash -c "cd '$dir' && makepkg --verifysource --noconfirm --skippgpcheck" >/dev/null 2>&1; then
              echo "::error file=$pkgbuild::sources do not verify"
              fail=1
            fi
          done
          exit $fail
