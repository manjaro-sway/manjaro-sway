name: build
on:
  schedule:
    - cron:  '30 2 * * 0'
  workflow_dispatch:
  repository_dispatch:
    types:
    - iso_profile_update
    - image_profile_update
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yaml
      - ci/**

concurrency: 
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  MIRROR: https://opencolo.mm.fcix.net/manjaro

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    steps:
      - id: time
        uses: boredland/get-time-action@dbc808befb89eb33fee64f5f4abce4d2a5fa7cfd # tag=2.0.0
        with:
          format: 'YYYYMMDDHHmm'
      - id: receive
        uses: boredland/kernel-info@f781d0a7da20c30fc67dfbb6dc0a7e219f529d6c # main
    outputs:
      release_tag: ${{ steps.time.outputs.time }}
      longterm: ${{ steps.receive.outputs.longterm-pkg }}
      stable: ${{ steps.receive.outputs.stable-pkg }}
  build-iso:
    runs-on: ubuntu-24.04
    needs: [prepare-release]
    strategy:
      fail-fast: false
      matrix:
        branch: [unstable]
        include:
          - branch: unstable
            kernel: ${{ needs.prepare-release.outputs.stable }}
    steps:
      - name: import sway key
        run: gpg --keyserver keys.openpgp.org --receive-keys ${{ vars.GPG_KEYID }}
      - name: prepare pacman pkg cache dir
        # Owned by the runner user so actions/cache can tar-restore without
        # sudo (tar needs to chown/utime the dir itself); pacman runs as
        # root inside basestrap and can still write to it.
        run: |
          sudo mkdir -p /var/cache/pacman/pkg
          sudo chown -R "$USER" /var/cache/pacman/pkg
      - name: cache pacman packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-pkg-${{ matrix.branch }}-x86_64-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            pacman-pkg-${{ matrix.branch }}-x86_64-${{ runner.os }}-${{ runner.arch }}-
      # the action moved into manjaro-contrib/release, so it has to be on
      # disk before it can be used; this job checks nothing out otherwise
      - name: fetch the build action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: manjaro-contrib/release
          ref: ea52031e3134917662798102d8c5ed83e464e2d6
          path: .buildiso
      - id: build
        name: x86_64 build
        uses: ./.buildiso/.github/actions/buildiso
        with:
          iso-profiles-repo: https://github.com/Manjaro-Sway/iso-profiles
          edition: sway
          branch: ${{ matrix.branch }}
          scope: full
          kernel: ${{ matrix.kernel }}
          release-tag: ${{ needs.prepare-release.outputs.release_tag }}
          additional-trusted-gpg: ${{ vars.GPG_KEYID }}
          build-mirror: ${{ env.MIRROR }}
      - name: upload iso artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iso-${{ matrix.branch }}
          path: ${{ steps.build.outputs.file-path }}
          retention-days: 1
          if-no-files-found: error
      - name: prune + chmod pacman cache
        if: always()
        run: |
          sudo paccache -rk1 -c /var/cache/pacman/pkg 2>/dev/null || true
          sudo chmod -R a+rX /var/cache/pacman/pkg 2>/dev/null || true
  test-iso-boot:
    runs-on: ubuntu-24.04
    needs: [build-iso]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        branch: [unstable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install qemu + kvm stack
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf ffmpeg
          # Self-hosted runners sometimes ship without /dev/kvm permissions
          sudo chmod 666 /dev/kvm || true
      - name: download iso
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: iso-${{ matrix.branch }}
          path: artifact
      - name: boot smoke test
        env:
          SERIAL_LOG_OUT: ${{ github.workspace }}/serial.log
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          ISO=$(ls artifact/*.iso | head -n1)
          ./ci/boot-smoke.sh "$ISO" x86_64
      - name: upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serial-iso-${{ matrix.branch }}
          path: serial.log
          if-no-files-found: warn
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-iso-boot-${{ matrix.branch }}
          path: screenshots/
          if-no-files-found: warn
  test-iso-install:
    # Level 1 of the install test plan: boot the live ISO and verify the
    # Calamares process actually exec's. Catches installer-package missing,
    # autostart broken, dependency rot. Does *not* drive the wizard UI —
    # that's Phase 2 / issue #982.
    # INJECT_HEADLESS_SWAY bypasses the pam_systemd XDG_RUNTIME_DIR failure
    # that prevents sway from starting in QEMU — see issue #982.
    runs-on: ubuntu-24.04
    needs: [build-iso]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        branch: [unstable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install qemu + kvm stack
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf ffmpeg
          sudo chmod 666 /dev/kvm || true
      - name: download iso
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: iso-${{ matrix.branch }}
          path: artifact
      - name: installer launch test
        env:
          SERIAL_LOG_OUT: ${{ github.workspace }}/serial.log
          BOOT_MARKER_REGEX: 'calamares'
          INJECT_HEADLESS_SWAY: '1'
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          ISO=$(ls artifact/*.iso | head -n1)
          # Boot + greetd + sway autostart + calamares exec — give it 12 min.
          ./ci/boot-smoke.sh "$ISO" x86_64 720
      - name: upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serial-install-${{ matrix.branch }}
          path: serial.log
          if-no-files-found: warn
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-iso-install-${{ matrix.branch }}
          path: screenshots/
          if-no-files-found: warn
  trigger-mirror:
    runs-on: ubuntu-24.04
    needs: [build-iso, test-iso-boot, test-iso-install]
    steps:
      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: manjaro-sway/manjaro-sway
          event-type: new_release
  rollback:
    runs-on: ubuntu-24.04
    needs: [build-iso, prepare-release]
    if: ${{ failure() || cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: rollback
        run: |
          echo ${{ github.token }} | gh auth login --with-token
          ASSET_COUNT=$(gh release view ${{ needs.prepare-release.outputs.release_tag }} --json "assets" --jq '.assets | length')
          if [ "$ASSET_COUNT" -gt "2" ]; then exit 0;fi
          gh release delete ${{ needs.prepare-release.outputs.release_tag }} -y --repo ${{ github.repository }}
          git push --delete origin ${{ needs.prepare-release.outputs.release_tag }}
