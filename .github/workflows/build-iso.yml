name: build-iso

on:
  schedule:
    - cron: '30 2 * * 0'
  push:
    branches: [main]
    paths:
      - iso-profiles/**
      - ci/**
      - .github/actions/buildiso/**
      - .github/workflows/build-iso.yml
  workflow_dispatch:

concurrency:
  group: build-iso
  cancel-in-progress: true

env:
  MIRROR: https://opencolo.mm.fcix.net/manjaro

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    steps:
      - id: time
        uses: boredland/get-time-action@dbc808befb89eb33fee64f5f4abce4d2a5fa7cfd # tag=2.0.0
        with:
          format: 'YYYYMMDDHHmm'
      - id: receive
        uses: boredland/kernel-info@f781d0a7da20c30fc67dfbb6dc0a7e219f529d6c # main
    outputs:
      release_tag: ${{ steps.time.outputs.time }}
      kernel: ${{ steps.receive.outputs.stable-pkg }}

  build-iso:
    runs-on: ubuntu-24.04
    needs: [prepare-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: prepare pacman pkg cache dir
        # Owned by the runner user so actions/cache can tar-restore without
        # sudo (tar needs to chown/utime the dir itself); pacman runs as
        # root inside basestrap and can still write to it.
        run: |
          sudo mkdir -p /var/cache/pacman/pkg
          sudo chown -R "$USER" /var/cache/pacman/pkg
      - name: cache pacman packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-pkg-unstable-x86_64-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            pacman-pkg-unstable-x86_64-${{ runner.os }}-${{ runner.arch }}-
      # Cheap, and it fails in seconds on the mistake that otherwise fails
      # the build an hour in: a profile naming a package no repository has.
      - name: every listed package resolves
        run: python3 scripts/check_iso_packages.py --kernel "${{ needs.prepare-release.outputs.kernel }}"
      - id: build
        name: x86_64 build
        # iso-profiles-repo left empty: the action copies the in-repo
        # iso-profiles/ tree, so the ISO is built from the commit under test
        uses: ./.github/actions/buildiso
        with:
          edition: sway
          branch: unstable
          scope: full
          kernel: ${{ needs.prepare-release.outputs.kernel }}
          additional-trusted-gpg: ${{ vars.GPG_KEYID }}
          build-mirror: ${{ env.MIRROR }}
      - name: upload iso artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iso-unstable
          path: ${{ steps.build.outputs.file-path }}
          retention-days: 1
          if-no-files-found: error
      - name: prune + chmod pacman cache
        if: always()
        run: |
          sudo paccache -rk1 -c /var/cache/pacman/pkg 2>/dev/null || true
          sudo chmod -R a+rX /var/cache/pacman/pkg 2>/dev/null || true

  test-iso-boot:
    runs-on: ubuntu-24.04
    needs: [build-iso]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install qemu + kvm stack
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf ffmpeg
          # Self-hosted runners sometimes ship without /dev/kvm permissions
          sudo chmod 666 /dev/kvm || true
      - name: download iso
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: iso-unstable
          path: artifact
      - name: boot smoke test
        env:
          SERIAL_LOG_OUT: ${{ github.workspace }}/serial.log
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          ISO=$(ls artifact/*.iso | head -n1)
          ./ci/boot-smoke.sh "$ISO" x86_64
      - name: upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serial-iso-unstable
          path: serial.log
          if-no-files-found: warn
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-iso-boot-unstable
          path: screenshots/
          if-no-files-found: warn

  test-iso-install:
    # Level 1 of the install test plan: boot the live ISO and verify the
    # Calamares process actually exec's. Catches installer-package missing,
    # autostart broken, dependency rot. Does *not* drive the wizard UI —
    # that's Phase 2 / issue #982.
    # INJECT_HEADLESS_SWAY bypasses the pam_systemd XDG_RUNTIME_DIR failure
    # that prevents sway from starting in QEMU — see issue #982.
    runs-on: ubuntu-24.04
    needs: [build-iso]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install qemu + kvm stack
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf ffmpeg
          sudo chmod 666 /dev/kvm || true
      - name: download iso
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: iso-unstable
          path: artifact
      - name: installer launch test
        env:
          SERIAL_LOG_OUT: ${{ github.workspace }}/serial.log
          BOOT_MARKER_REGEX: 'calamares'
          INJECT_HEADLESS_SWAY: '1'
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          ISO=$(ls artifact/*.iso | head -n1)
          # Boot + greetd + sway autostart + calamares exec — give it 12 min.
          ./ci/boot-smoke.sh "$ISO" x86_64 720
      - name: upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serial-install-unstable
          path: serial.log
          if-no-files-found: warn
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-iso-install-unstable
          path: screenshots/
          if-no-files-found: warn

  publish:
    # Nothing is published until something has booted it. An ISO that
    # assembles is not an ISO that works, and mkarchiso exiting zero says
    # only the first.
    needs: [prepare-release, build-iso, test-iso-boot, test-iso-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: iso-unstable
          path: out
      - name: checksum
        # Computed here rather than carried: the artefact round trip is
        # what the checksum is meant to prove the image survived.
        working-directory: out
        run: sha256sum ./*.iso > SHA256SUMS
      - name: upload to R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: sway-iso
          VERSION: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          sudo apt-get install -y --no-install-recommends python3-boto3
          python3 scripts/upload_iso.py --iso-dir out --version "$VERSION"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          # the ISO itself is not attached: github caps a release asset at
          # 2 GB and this one is larger. The bucket holds the image; the
          # release holds the checksum that proves which image it is.
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$VERSION" out/SHA256SUMS \
              --repo "${{ github.repository }}" --clobber
            # The tag moves by git, not by `gh release edit --target`:
            # retargeting an existing release moves the underlying ref, and
            # GITHUB_TOKEN is refused there - "Resource not accessible by
            # integration" - however much `contents: write` the job has.
            git config --global --add safe.directory "$PWD"
            git tag -f "$VERSION" "$GITHUB_SHA"
            git push -f origin "refs/tags/$VERSION"
            echo "## replaced the assets on the existing $VERSION"
          else
            gh release create "$VERSION" out/SHA256SUMS \
              --repo "${{ github.repository }}" \
              --title "Manjaro Sway $VERSION" \
              --notes "https://sway.manjaro.download/iso/$VERSION/"
          fi

  rollback:
    needs: [prepare-release, publish]
    if: ${{ always() && needs.publish.result == 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: drop a half-published release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1 || exit 0
          gh release delete "$VERSION" -y --repo "${{ github.repository }}"
          git push --delete origin "$VERSION" || true
