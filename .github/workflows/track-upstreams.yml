name: track-upstreams

# Upstream moves; our vendored copies do not. This looks once a day and
# opens one pull request per item that changed.
#
# Two kinds of item, one mechanism: the vendored PKGBUILDs under packages/,
# and the files under iso-profiles/shared/ that come from Manjaro's own
# profile. The second kind is the one nothing else would catch - no build
# reads them from upstream, so an ISO keeps being assembled from whatever
# was vendored, however old.
#
# One per item, not one for all of them: a conflict in wluma should not
# hold up a clean update to swayr, and a PR that touches one file is a PR
# someone can actually review. Each branch is named for its item, so a
# second run updates the existing PR rather than opening another.
#
# Never a direct push: several vendored PKGBUILDs carry deliberate local
# edits, and whether an upstream change is still compatible with them is a
# judgement call. The merge is three-way against packages/.upstream/, so a
# change to a line we never touched applies cleanly and one to a line we
# did touch is reported as a conflict with our file left alone.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: track-upstreams
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run install

      - name: look for upstream changes
        id: track
        env:
          # raises the GitHub API rate limit from 60/hour per address to
          # 1000, which matters on a shared runner
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/track_upstreams.py --apply --report-dir /tmp/pr > /tmp/summary.json
          status=$?
          set -e
          cat /tmp/summary.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "2" ]; then
            echo "::warning::could not check $(jq -r '.failed | join(", ")' /tmp/summary.json)"
          fi

      - name: open a pull request per package
        if: steps.track.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # the commit every branch starts from; `base` below means a
          # merge-base FILE, which is a different thing entirely
          head=$(git rev-parse HEAD)
          failures=0

          # A clean merge wrote files; a conflict wrote none. Both produce a
          # report, so drive the loop off the reports and decide per package.
          for report in /tmp/pr/*.md; do
            [ -e "$report" ] || continue
            slug=$(basename "$report" .md)
            # the script writes `/` as `__`, because an iso-profiles item is
            # a path and cannot be a filename as-is
            name=${slug//__//}
            branch="track-upstream/$slug"

            # Which pair of paths this item owns. A package is a directory
            # plus a base file; an iso-profiles item is one file plus its
            # base, under a different root.
            case "$name" in
              shared/*) ours="iso-profiles/$name"; base="iso-profiles/.upstream/$name" ;;
              *)        ours="packages/$name";     base="packages/.upstream/$name.PKGBUILD" ;;
            esac

            # A conflicted item wrote no files, so decide BEFORE creating
            # a branch - otherwise every conflict leaves an empty branch
            # behind that no pull request ever references.
            if git diff --quiet -- "$ours" "$base"; then
              # conflicted: nothing to commit, so report it as an issue
              # rather than an empty pull request
              existing=$(gh issue list --search "in:title track upstream: $name" \
                --state open --json number --jq '.[0].number // empty')
              if [ -n "$existing" ]; then
                gh issue comment "$existing" --body-file "$report"
              else
                gh issue create --title "track upstream: $name needs a human" \
                  --body-file "$report"
              fi
              continue
            fi

            # each PR starts from the base commit, so one does not carry
            # another's changes
            git checkout -q -B "$branch" "$head"
            git add "$ours" "$base"
            git commit -q -m "track upstream: $name"
            git push -q --force origin "$branch"

            # `gh pr create` fails if one is already open for this branch,
            # which is the normal second-run case - so fall back to updating
            # it. Errors are NOT discarded: hiding them turned "the org
            # forbids workflows from opening pull requests" into the far
            # less useful "no pull requests found for branch".
            if ! gh pr create --head "$branch" --base main \
                 --title "track upstream: $name" --body-file "$report"; then
              gh pr edit "$branch" --body-file "$report" || {
                echo "::error::could not open or update a pull request for $name."
                echo "::error::If this says 'GitHub Actions is not permitted to create pull requests',"
                echo "::error::enable it in the manjaro-sway org settings: Actions > General >"
                echo "::error::Workflow permissions > Allow GitHub Actions to create and approve pull requests."
                failures=1
              }
            fi
          done

          git checkout -q "$head"
          exit "$failures"
