# Themes the out-of-process xdg-desktop-portal-lxqt file dialog, NOT regular
# Qt apps -- those are styled via QT_STYLE_OVERRIDE in .profile. The portal
# backend is Qt6 and is launched with QT_QPA_PLATFORMTHEME=lxqt hardcoded into
# its D-Bus activation line, so this is the only way to style it.
[Qt]
style=qt6ct-style
