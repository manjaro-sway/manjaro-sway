# D-Bus activation starts the backend the moment a client asks for a portal,
# which at login is before sway has imported WAYLAND_DISPLAY. The guard is the
# one xdg-desktop-portal-wlr already ships: a premature activation is skipped
# and re-evaluated at the next call, instead of failing with "cannot open
# display" (manjaro-sway#1049).
[Unit]
After=sway-session.target
ConditionEnvironment=WAYLAND_DISPLAY

[Service]
Restart=on-failure
RestartSec=1
