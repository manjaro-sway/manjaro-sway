# catppuccin-frappe

# some global theme specific variables
set $gtk-theme catppuccin-frappe-blue-standard+default 
set $icon-theme catppuccin-frappe-blue-standard+default
set $gui-font Roboto 11
set $term-font JetBrainsMono NF
set $gtk-color-scheme prefer-dark
set $kvantum-theme catppuccin-frappe-blue
set $background $HOME/.config/sway/generated_background.svg
set $cursor-theme phinger-cursors-light
set $vscode-theme "Noctis Hibernus"

set $rosewater #f2d5cf
set $flamingo #eebebe
set $pink #f4b8e4
set $mauve #ca9ee6
set $red #e78284
set $maroon #ea999c
set $peach #ef9f76
set $yellow #e5c890
set $green #a6d189
set $teal #81c8be
set $sky #99d1db
set $sapphire #85c1dc
set $blue #8caaee
set $lavender #babbf1
set $text #c6d0f5
set $subtext1 #b5bfe2
set $subtext0 #a5adce
set $overlay2 #949cbb
set $overlay1 #838ba7
set $overlay0 #737994
set $surface2 #626880
set $surface1 #51576d
set $surface0 #414559
set $base #303446
set $mantle #292c3c
set $crust #232634

# ANSI colors
set $color0 #51576d
set $color1 #e78284
set $color3 #e5c890
set $color5 #f4b8e4
set $color6 #81c8be
set $color7 #b5bfe2
set $color8 #626880
set $color9 #e78284
set $color10 #a6d189
set $color11 #e5c890
set $color12 #8caaee
set $color13 #f4b8e4

set $background-color $base
set $text-color $text
set $accent-color $mauve

# target                 title     bg    text   indicator  border
client.focused           $lavender $base $text  $rosewater $lavender
client.focused_inactive  $overlay0 $base $text  $rosewater $overlay0
client.unfocused         $overlay0 $base $text  $rosewater $overlay0
client.urgent            $peach    $base $peach $overlay0  $peach
client.placeholder       $overlay0 $base $text  $overlay0  $overlay0
client.background        $base
