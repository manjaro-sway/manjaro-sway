# catppuccin-macchiato

# some global theme specific variables
set $gtk-theme catppuccin-macchiato-blue-standard+default 
set $icon-theme catppuccin-macchiato-blue-standard+default
set $gui-font Roboto 11
set $term-font JetBrainsMono NF
set $gtk-color-scheme prefer-dark
set $kvantum-theme catppuccin-macchiato-blue
set $background $HOME/.config/sway/generated_background.svg
set $cursor-theme phinger-cursors-light
set $vscode-theme "Noctis Sereno"

set $rosewater #f4dbd6
set $flamingo #f0c6c6
set $pink #f5bde6
set $mauve #c6a0f6
set $red #ed8796
set $maroon #ee99a0
set $peach #f5a97f
set $yellow #eed49f
set $green #a6da95
set $teal #8bd5ca
set $sky #91d7e3
set $sapphire #7dc4e4
set $blue #8aadf4
set $lavender #b7bdf8
set $text #cad3f5
set $subtext1 #b8c0e0
set $subtext0 #a5adcb
set $overlay2 #939ab7
set $overlay1 #8087a2
set $overlay0 #6e738d
set $surface2 #5b6078
set $surface1 #494d64
set $surface0 #363a4f
set $base #24273a
set $mantle #1e2030
set $crust #181926

# ANSI colors
set $color0 #494d64
set $color1 #ed8796
set $color3 #eed49f
set $color5 #f5bde6
set $color6 #8bd5ca
set $color7 #b8c0e0
set $color8 #5b6078
set $color9 #ed8796
set $color10 #a6da95
set $color11 #eed49f
set $color12 #8aadf4
set $color13 #f5bde6

set $background-color $base
set $text-color $text
set $accent-color $teal

# target                 title     bg    text   indicator  border
client.focused           $lavender $base $text  $rosewater $lavender
client.focused_inactive  $overlay0 $base $text  $rosewater $overlay0
client.unfocused         $overlay0 $base $text  $rosewater $overlay0
client.urgent            $peach    $base $peach $overlay0  $peach
client.placeholder       $overlay0 $base $text  $overlay0  $overlay0
client.background        $base
